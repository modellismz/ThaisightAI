# ThaisightAI Docker Services

services:
  postgres:
    image: postgres:16-alpine
    container_name: thaisight-postgres
    environment:
      POSTGRES_USER: thaisight
      POSTGRES_PASSWORD: thaisight_dev
      POSTGRES_DB: thaisight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U thaisight" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thaisight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: thaisight-minio
    environment:
      MINIO_ROOT_USER: thaisight
      MINIO_ROOT_PASSWORD: thaisight_dev
    ports:
      - "9000:9000"
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: thaisight-api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://thaisight:thaisight_dev@postgres:5432/thaisight
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: thaisight-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
